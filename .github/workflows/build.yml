name: build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]   # a published release gets the built app attached as a zip

jobs:
  build-and-test:
    name: Build app + unit tests (Windows)
    runs-on: windows-latest
    permissions:
      contents: write   # only used to attach the zip to a published release
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: nuget restore LawyerProject.sln

      - name: Build (WinForms app + tests)
        run: msbuild LawyerProject.sln /p:Configuration=Release /m /v:minimal

      - name: Unit tests
        run: dotnet test tests/Quedin.Tests/Quedin.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Integration tests (only when LocalDB is installed on the runner)
        shell: pwsh
        run: |
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue) -or -not (Get-Command sqlcmd -ErrorAction SilentlyContinue)) {
            Write-Host "LocalDB or sqlcmd is not available on this runner - skipping integration tests."
            exit 0
          }
          sqllocaldb start MSSQLLocalDB
          sqlcmd -S "(localdb)\MSSQLLocalDB" -b -i database\create-database.sql
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Quedin.IntegrationTests/Quedin.IntegrationTests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: QUEDIN-Release
          path: |
            LawyerProject/bin/Release/*.exe
            LawyerProject/bin/Release/*.dll
            LawyerProject/bin/Release/*.config
            database/create-database.sql

      - name: Attach the app to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $dir = "QUEDIN-$tag"
          New-Item -ItemType Directory -Force "$dir/app", "$dir/database" | Out-Null
          Copy-Item LawyerProject/bin/Release/*.exe, LawyerProject/bin/Release/*.dll, LawyerProject/bin/Release/*.config "$dir/app"
          Copy-Item database/create-database.sql, database/security.sql, database/backup-nightly.cmd "$dir/database"
          Copy-Item packaging/HOW-TO-RUN.txt, LICENSE "$dir"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force
          gh release upload $tag "$dir.zip" --clobber

  database:
    name: Database script on SQL Server 2022
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Passw0rd!"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4

      - name: Wait for SQL Server
        run: |
          CID=$(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")
          echo "CID=$CID" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Passw0rd!' -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is up"; exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not start"; exit 1

      - name: Run create-database.sql (twice, to prove it can be re-run)
        run: |
          docker cp database/create-database.sql "$CID":/tmp/create-database.sql
          for run in 1 2; do
            docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P 'Ci-Passw0rd!' -i /tmp/create-database.sql
          done

      - name: Verify demo data
        run: |
          docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P 'Ci-Passw0rd!' -d QuedinDB -Q "
            SET NOCOUNT ON;
            IF (SELECT COUNT(*) FROM Users) <> 2 THROW 50001, 'Users', 1;
            IF (SELECT COUNT(*) FROM Customers) <> 12 THROW 50002, 'Customers', 1;
            IF (SELECT COUNT(*) FROM Cases) <> 5 THROW 50003, 'Cases', 1;
            IF (SELECT COUNT(*) FROM CaseSteps) <> 37 THROW 50004, 'Steps', 1;
            IF (SELECT COUNT(*) FROM Payments) <> 4 THROW 50005, 'Payments', 1;
            IF EXISTS (SELECT 1 FROM Users WHERE PasswordHash NOT LIKE 'pbkdf2$%') THROW 50006, 'Plain-text password', 1;
            IF EXISTS (SELECT 1 FROM Cases c JOIN CaseTypes t ON t.CaseTypeId = c.CaseTypeId
                       WHERE c.IsPaid = 1 AND (SELECT SUM(Amount) FROM Payments p WHERE p.CaseId = c.CaseId)
                             < CASE WHEN c.ClaimAmount * c.FeePercent / 100 > t.BaseFee THEN c.ClaimAmount * c.FeePercent / 100 ELSE t.BaseFee END + t.CourtFee)
              THROW 50009, 'A case marked paid has an open balance', 1;
            IF EXISTS (
              SELECT 1 FROM Cases c
              CROSS APPLY (SELECT TOP 1 s.ProcedureId FROM CaseSteps s
                           WHERE s.CaseId = c.CaseId AND s.IsDone = 0
                           ORDER BY s.CaseStepId) nextStep
              WHERE nextStep.ProcedureId <> c.CurrentProcedureId) THROW 50007, 'Case status does not match next step', 1;
            BEGIN TRY
              DELETE FROM AuditLog;
              THROW 50008, 'Audit log is not append-only', 1;
            END TRY
            BEGIN CATCH
              IF ERROR_NUMBER() = 50008 THROW;
            END CATCH
            PRINT 'Demo data verified.';"

      - name: Permissions script - a worker cannot read passwords or edit payments
        run: |
          docker cp database/security.sql "$CID":/tmp/security.sql
          SQL="docker exec $CID /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost"
          for run in 1 2; do $SQL -U sa -P 'Ci-Passw0rd!' -i /tmp/security.sql; done
          $SQL -U sa -P 'Ci-Passw0rd!' -d QuedinDB -Q "
            IF SUSER_ID('ci_worker') IS NULL CREATE LOGIN ci_worker WITH PASSWORD = 'Ci-Worker-1!', CHECK_POLICY = OFF;
            IF USER_ID('ci_worker') IS NULL CREATE USER ci_worker FOR LOGIN ci_worker;
            ALTER ROLE QuedinWorker ADD MEMBER ci_worker;"
          W="$SQL -U ci_worker -P Ci-Worker-1! -d QuedinDB"
          # Allowed: reading cases and logging in through the procedures.
          $W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Cases; EXEC dbo.usp_GetLoginSalt N'admin';"
          # Refused: each of these must fail.
          for q in "SELECT PasswordHash FROM dbo.Users" \
                   "UPDATE dbo.Users SET PasswordHash = N'x' WHERE UserName = N'admin'" \
                   "UPDATE dbo.Payments SET Amount = 1 WHERE PaymentId = 1" \
                   "DELETE FROM dbo.Payments WHERE PaymentId = 1" \
                   "UPDATE dbo.CaseSteps SET IsDone = 0 WHERE IsDone = 1" \
                   "DELETE FROM dbo.AuditLog"; do
            if $W -Q "$q" >/dev/null 2>&1; then echo "NOT REFUSED: $q"; exit 1; fi
            echo "refused as expected: $q"
          done
          # Even the owner cannot change a recorded amount (trigger).
          if $SQL -U sa -P 'Ci-Passw0rd!' -d QuedinDB -Q "UPDATE dbo.Payments SET Amount = 1 WHERE PaymentId = 1" >/dev/null 2>&1; then
            echo "Payment amount was changed"; exit 1; fi
          echo "Permissions verified."
